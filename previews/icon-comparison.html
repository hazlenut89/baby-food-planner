<!doctype html><html lang="ko"><meta charset="utf-8"><title>식재료 아이콘 수정 전후</title><style>body{background:#fffcf5;color:#594634;font:16px sans-serif;padding:24px}section{display:flex;align-items:center;gap:32px;padding:20px}svg,img{width:48px;height:48px}figure{text-align:center}</style><h1>기존 앱 / 준비된 통일 디자인</h1><p>새 디자인은 미리보기에만 적용되어 있습니다.</p><div id="rows"></div><script src="../v3/icons.js"></script><script src="../assets/food-icons/adapter.js"></script><script>for(const name of ['양파','렌틸콩','병아리콩','완두콩','브로콜리']){const s=document.createElement('section');const title=document.createElement('b');title.textContent=name;s.append(title);const old=document.createElement('figure');old.innerHTML=PlannerIcons.food(name)+'<figcaption>기존 앱</figcaption>';const next=document.createElement('figure');next.append(PlannerFoodIcons.create(name,48));const cap=document.createElement('figcaption');cap.textContent='통일 디자인';next.append(cap);s.append(old,next);rows.append(s)}</script></html>
