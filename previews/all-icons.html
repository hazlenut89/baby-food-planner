<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전체 식재료 아이콘 검토</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#fffcf5;color:#594634;font:16px -apple-system,sans-serif}h1{font-size:26px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fffdf9;border:1px solid #ede3d4;border-radius:16px;padding:16px}.samples{display:flex;align-items:end;justify-content:space-around;gap:12px;min-height:80px}figure{margin:0;text-align:center}figcaption{font-size:11px;margin-top:9px;color:#8a7866}h2{font-size:16px;margin:0}p{line-height:1.6} @media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}body{padding:12px}} @media(max-width:400px){.grid{grid-template-columns:1fr}}</style><h1>초기·중기 식재료 전체 아이콘</h1><p>40종 식재료 + 초기 식단의 ‘곡류’ 표기 + 기본 아이콘<br>24 · 32 · 48px / 승인된 파스텔 스타일 / 실제 앱 미적용</p><div class="grid" id="grid"></div><script src="../assets/food-icons/adapter.js"></script><script>for(const name of [...PlannerFoodIcons.names,'미등록 식재료']){const card=document.createElement('section');card.className='card';const title=document.createElement('h2');title.textContent=name;card.append(title);const samples=document.createElement('div');samples.className='samples';for(const size of [24,32,48]){const figure=document.createElement('figure');figure.append(PlannerFoodIcons.create(name,size));const caption=document.createElement('figcaption');caption.textContent=size+'px';figure.append(caption);samples.append(figure)}card.append(samples);grid.append(card)}</script></html>
